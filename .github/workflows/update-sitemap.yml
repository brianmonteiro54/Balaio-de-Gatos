name: Atualizar sitemap

# Roda ANTES do Pages re-deployar, regenerando sitemap.xml com lastmod novo
# sempre que algum HTML mudar. Se o sitemap precisar de update, faz commit
# (com [skip ci] pra não disparar o CI de novo) e o Pages publica a versão
# atualizada automaticamente.

on:
  push:
    branches: [main]
    paths:
      - "**/index.html"
      - "scripts/generate_sitemap.py"
      - ".github/workflows/update-sitemap.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Força actions JS a rodarem no Node 24 (runtime interno).
  # Vai virar default em junho/2026; antecipamos pra silenciar o warning de deprecation.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: sitemap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: python scripts/generate_sitemap.py

      - name: Commit se mudou
        run: |
          if [ -n "$(git status --porcelain sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore(seo): atualizar sitemap.xml [skip ci]"
            git push
          else
            echo "sitemap.xml já está atualizado, nada a commitar."
          fi
