name: Atualizar sitemap

on:
  push:
    branches: [main]
    paths:
      - "**/index.html"
      - "scripts/generate_sitemap.py"
      - ".github/workflows/update-sitemap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerar sitemap.xml
        run: python scripts/generate_sitemap.py

      - name: Commit se mudou
        run: |
          if [ -n "$(git status --porcelain sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore(seo): atualizar sitemap.xml [skip ci]"
            git push
          else
            echo "sitemap.xml já está atualizado, nada a commitar."
          fi
